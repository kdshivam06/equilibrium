<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .text-white { fill: #ffffff; font-family: -apple-system, system-ui, sans-serif; }
      .text-orange { fill: #f97316; font-family: -apple-system, system-ui, sans-serif; font-weight: bold; }
      .text-slate { fill: #94a3b8; font-family: -apple-system, system-ui, sans-serif; }
      .box-bg { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 8; ry: 8; }
      .box-bg-highlight { fill: #1e293b; stroke: #f97316; stroke-width: 2; rx: 8; ry: 8; }
      .line { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 4; }
      .arrow { fill: #475569; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" class="bg" />

  <!-- Main System Boundary -->
  <rect x="50" y="50" width="700" height="300" fill="none" stroke="#334155" stroke-width="2" rx="12" stroke-dasharray="8"/>
  <text x="400" y="80" class="text-white" font-size="20" font-weight="bold" text-anchor="middle">Equilibrium Portal</text>
  <text x="400" y="100" class="text-slate" font-size="14" text-anchor="middle">(Next.js 14, Vercel)</text>

  <!-- Client Side -->
  <rect x="150" y="140" width="200" height="60" class="box-bg" />
  <text x="250" y="175" class="text-white" font-size="16" text-anchor="middle">Employee Dashboard</text>

  <rect x="450" y="140" width="200" height="60" class="box-bg" />
  <text x="550" y="175" class="text-white" font-size="16" text-anchor="middle">Manager Dashboard</text>

  <!-- Server Side -->
  <rect x="250" y="260" width="300" height="60" class="box-bg-highlight" />
  <text x="400" y="285" class="text-orange" font-size="16" text-anchor="middle">Next.js API Routes</text>
  <text x="400" y="305" class="text-white" font-size="14" text-anchor="middle">+ Vercel Cron Jobs</text>

  <!-- External Services -->
  <rect x="100" y="450" width="180" height="80" class="box-bg" />
  <text x="190" y="480" class="text-white" font-size="16" font-weight="bold" text-anchor="middle">Supabase</text>
  <text x="190" y="500" class="text-slate" font-size="12" text-anchor="middle">Postgres + Auth + RLS</text>

  <rect x="330" y="450" width="140" height="80" class="box-bg" />
  <text x="400" y="480" class="text-white" font-size="16" font-weight="bold" text-anchor="middle">Resend</text>
  <text x="400" y="500" class="text-slate" font-size="12" text-anchor="middle">Email API</text>

  <rect x="520" y="450" width="180" height="80" class="box-bg" />
  <text x="610" y="480" class="text-white" font-size="16" font-weight="bold" text-anchor="middle">GitHub</text>
  <text x="610" y="500" class="text-slate" font-size="12" text-anchor="middle">Repository</text>

  <!-- Arrows -->
  <path d="M 250 200 L 250 230 L 400 230 L 400 250" class="line" marker-end="url(#arrowhead)"/>
  <path d="M 550 200 L 550 230 L 400 230 L 400 250" class="line" marker-end="url(#arrowhead)"/>

  <path d="M 400 320 L 400 400 L 190 400 L 190 440" class="line" marker-end="url(#arrowhead)"/>
  <path d="M 400 320 L 400 440" class="line" marker-end="url(#arrowhead)"/>
  <path d="M 400 320 L 400 400 L 610 400 L 610 440" class="line" marker-end="url(#arrowhead)"/>

  <!-- Cost Banner -->
  <text x="400" y="580" class="text-slate" font-size="14" text-anchor="middle">Cost: $0/month (Free Tiers: Vercel Hobby, Supabase Free, Resend Free)</text>

</svg>
